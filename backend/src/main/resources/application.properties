spring.application.name=school-management
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8080

# Pour la generation de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- Email ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# On ferme la session JPA a la sortie de la couche service
spring.jpa.open-in-view=false

# JSON (les dates sont serialisees en ISO-8601 par defaut)
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info

# CORS : origines autorisees pour le frontend React
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Datasource (commun a dev et prod) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Multipart Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Upload fichiers
app.upload.dir=./uploads/absences
app.upload.max-size=10485760
app.upload.allowed-types=application/pdf,image/jpeg,image/png,image/jpg