spring.application.name=school-management
spring.profiles.active=dev

server.port=8080

# On ferme la session JPA a la sortie de la couche service
spring.jpa.open-in-view=false

# JSON (les dates sont serialisees en ISO-8601 par defaut)
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info

# CORS : origines autorisees pour le frontend React
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Datasource (commun a dev et prod) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver